<!doctype html>
<html><head><meta charset="utf-8"><title>MO Type</title><link rel="stylesheet" href="styles.css"></head>
<body><header><span class="brand">MO</span><span>TYPE</span><small>0.1.5</small></header><main>
  <nav class="main-tabs" id="mainTabs"><button class="active" data-view="create">CREATE</button><button data-view="library">LIBRARY</button></nav>
  <section id="createView">
    <label>PREVIEW TEXT</label><textarea id="previewText" rows="1" spellcheck="false">Your text in motion</textarea>
    <section class="preview"><span id="sample"></span></section>
    <div class="phase-tabs" id="phase"><button class="active" data-phase="in">IN</button><button data-phase="out">OUT</button></div>
    <label>ANIMATE BY</label>
    <div class="icon-grid units" id="unit">
      <button class="active" data-unit="words" title="Words"><svg viewBox="0 0 64 32"><text x="32" y="21">WORD</text></svg></button>
      <button data-unit="characters" title="Characters"><svg viewBox="0 0 64 32"><text class="letter" x="32" y="23">A</text></svg></button>
      <button data-unit="lines" title="Lines"><svg viewBox="0 0 64 32"><path d="M12 11h40M12 21h40"/></svg></button>
    </div>
    <label>DIRECTION</label>
    <div class="icon-grid presets" id="preset">
      <button data-preset="none" title="No direction"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8"/><path d="M9 23 23 9"/></svg></button>
      <button class="active" data-preset="up" title="Rise"><svg viewBox="0 0 32 32"><path d="M16 25V7m-7 7 7-7 7 7"/></svg></button>
      <button data-preset="down" title="Drop"><svg viewBox="0 0 32 32"><path d="M16 7v18m-7-7 7 7 7-7"/></svg></button>
      <button data-preset="left" title="Slide from left"><svg viewBox="0 0 32 32"><path d="M25 16H7m7-7-7 7 7 7"/></svg></button>
      <button data-preset="right" title="Slide from right"><svg viewBox="0 0 32 32"><path d="M7 16h18m-7-7 7 7-7 7"/></svg></button>
      <button data-preset="fade" title="Fade"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9"/><path class="dashed" d="M16 7a9 9 0 0 0 0 18"/></svg></button>
    </div>
    <div class="grid"><label>DISTANCE <output id="distanceOut">40 px</output><input id="distance" type="range" min="0" max="200" value="40"></label><label>DURATION <output id="durationOut">30 fr</output><input id="duration" type="range" min="10" max="80" step="10" value="30"></label></div>
    <label>OVERLAP <output id="overlapOut">90%</output><input id="overlap" type="range" min="0" max="90" value="90"></label>
    <div id="outAdvanced"><label>OUT EASE <output id="easeOut">100%</output><input id="ease" type="range" min="-100" max="100" value="100"></label></div>
    <div class="actions"><button id="clean">Clean</button><button id="release" title="Detach to a native After Effects controller">Release</button><button id="apply">Apply IN</button></div>
  </section>
  <section id="libraryView">
    <label>NEW PRESET</label>
    <div class="preset-save"><input id="presetName" type="text" maxlength="24" placeholder="Preset name"><button id="savePreset" title="Save panel settings">+</button><button id="saveLayerPreset" title="Save selected layer controls">Save from Layer</button></div>
    <label>SAVED PRESETS</label>
    <div class="preset-library" id="presetLibrary"></div>
  </section>
  <p id="status">Select one text layer in After Effects.</p>
  <footer class="plugin-credit">By <a id="authorLink" href="https://www.instagram.com/brunojorri_work/">Bruno Jorri</a></footer>
</main><script src="CSInterface.js"></script><script src="app.js"></script></body></html>
